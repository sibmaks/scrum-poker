services:
  scrum_poker:
    build:
      context: .
    image: scrum-poker:local
    container_name: scrum_poker_h2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    environment:
      SPRING_PROFILES_ACTIVE: h2
      SERVER_PORT: 8080
      JAVA_OPTS: -Xmx128m
