services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scrum_poker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: a12345
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrum_poker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres16_data:/var/lib/postgresql/data

  scrum_poker:
    build:
      context: .
    image: scrum-poker:local
    container_name: scrum_poker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    environment:
      SERVER_PORT: 8080

      # Data source
      # currentSchema also sets PostgreSQL search_path for native and scheduled queries.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scrum_poker?currentSchema=scrum_poker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: a12345
      SPRING_JPA_SHOW_SQL: "true"

      # Application properties
      APP_SESSION_TTL_TYPE: DAYS
      APP_SESSION_TTL_VALUE: 30

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: scrum_poker

      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: TRACE
      LOGGING_LEVEL_COM_GITHUB_SIBMAKS_SP_SERVICE: DEBUG
      JAVA_OPTS: -Xmx128m

volumes:
  postgres16_data:
