# In-memory H2 database for local development.
spring.datasource.url=jdbc:h2:mem:scrum_poker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=scrum_poker
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=scrum_poker
spring.flyway.locations=classpath:db/migration,classpath:db/h2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

app.session.ttl.type=DAYS
app.session.ttl.value=30
